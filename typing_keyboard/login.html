<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Воридшавӣ - TAJIKTYPING</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0f172a;
        }
        .auth-card {
            background: #1e293b;
            padding: 35px;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            color: #fff;
        }
        .auth-card h2 { text-align: center; margin-bottom: 24px; color: #38bdf8; font-size: 24px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 14px; color: #94a3b8; }
        .form-group input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            box-sizing: border-box;
            outline: none;
        }
        .form-group input:focus { border-color: #38bdf8; }
        .auth-btn {
            width: 100%;
            padding: 12px;
            background: #0284c7;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            font-size: 15px;
        }
        .auth-btn:hover { background: #0369a1; }
        
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: #64748b;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #334155;
        }
        .divider span { padding: 0 10px; font-size: 13px; }

        .google-btn {
            width: 100%;
            padding: 12px;
            background: #ffffff;
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 15px;
        }
        .google-btn:hover { background: #e2e8f0; }

        .toggle-text { text-align: center; margin-top: 20px; font-size: 14px; color: #94a3b8; }
        .toggle-text a { color: #38bdf8; text-decoration: none; cursor: pointer; font-weight: 600; }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">
            <h2 id="auth-title">Воридшавӣ ба TAJIKTYPING</h2>
            
            <button class="google-btn" id="googleBtn">
                <svg width="18" height="18" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                Идома додан бо Google
            </button>

            <div class="divider"><span>ё бо почтаи электронӣ</span></div>

            <form id="authForm">
                <div class="form-group" id="nameGroup" style="display: none;">
                    <label>Номи шумо</label>
                    <input type="text" id="authName" placeholder="Номатонро нависед">
                </div>
                <div class="form-group">
                    <label>E-mail</label>
                    <input type="email" id="authEmail" required placeholder="example@gmail.com">
                </div>
                <div class="form-group">
                    <label>Парол</label>
                    <input type="password" id="authPassword" required placeholder="******">
                </div>
                <button type="submit" class="auth-btn" id="submitBtn">Ворид шудан</button>
            </form>

            <div class="toggle-text">
                <span id="toggleMsg">Ҳисоб надоред?</span> 
                <a id="toggleAuth">Рӯйхатгирӣ (Регистрация)</a>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAYFjn-oKlBQ-IWcGdj2Zqn89XnsIteWxU",
            authDomain: "tajiktyping.firebaseapp.com",
            projectId: "tajiktyping",
            storageBucket: "tajiktyping.firebasestorage.app",
            messagingSenderId: "942130540563",
            appId: "1:942130540563:web:24ec63a9b5dfecb771cfe6",
            measurementId: "G-9EDFJ8QBD4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const googleProvider = new GoogleAuthProvider();

        let isLogin = true;

        const toggleAuth = document.getElementById('toggleAuth');
        const authTitle = document.getElementById('auth-title');
        const submitBtn = document.getElementById('submitBtn');
        const nameGroup = document.getElementById('nameGroup');
        const toggleMsg = document.getElementById('toggleMsg');

        // Воридшавӣ бо Google
        document.getElementById('googleBtn').addEventListener('click', async () => {
            try {
                await signInWithPopup(auth, googleProvider);
                window.location.href = 'index.html';
            } catch (error) {
                alert("Хатогӣ ҳангоми воридшавӣ бо Google: " + error.message);
            }
        });

        // Аваз кардани фарм (Login / Register)
        toggleAuth.addEventListener('click', () => {
            isLogin = !isLogin;
            if(isLogin) {
                authTitle.textContent = "Воридшавӣ ба TAJIKTYPING";
                submitBtn.textContent = "Ворид шудан";
                nameGroup.style.display = "none";
                toggleMsg.textContent = "Ҳисоб надоред?";
                toggleAuth.textContent = "Рӯйхатгирӣ (Регистрация)";
            } else {
                authTitle.textContent = "Рӯйхатгирии нав";
                submitBtn.textContent = "Сохтани ҳисоб";
                nameGroup.style.display = "block";
                toggleMsg.textContent = "Аллокай ҳисоб доред?";
                toggleAuth.textContent = "Ворид шудан";
            }
        });

        // Формаи Login / Register
        document.getElementById('authForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('authEmail').value;
            const password = document.getElementById('authPassword').value;
            const name = document.getElementById('authName').value;

            try {
                if (isLogin) {
                    await signInWithEmailAndPassword(auth, email, password);
                } else {
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    if (name) {
                        await updateProfile(userCredential.user, { displayName: name });
                    }
                }
                window.location.href = 'index.html';
            } catch (error) {
                alert("Хатогӣ: " + error.message);
            }
        });
    </script>
</body>
</html>
